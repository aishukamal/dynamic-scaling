apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: rs4c-orch
  namespace: default
  labels:
    scheduling.x-k8s.io/gang-id: "rs4c"
spec:
  failurePolicy:
    maxRestarts: 0
    restartStrategy: Recreate
  network:
    enableDNSHostnames: true
    # publishNotReadyAddresses: true
  replicatedJobs:
  - name: proc
    replicas: 1
    template:
      metadata:
        annotations: {}
      spec:
        backoffLimit: 0
        completionMode: Indexed
        completions: 1
        parallelism: 1
        template:
          metadata:
            annotations:
              # ensure exclusive access to the node
              # The orchestrator is idle for long stretches -- it blocks on one
              # train_step RPC that can run for an hour at 397B -- so the cluster
              # autoscaler sees an underused CPU node and reclaims it. The pod then
              # disappears with no error and no restart count, JobSet recreates it,
              # and the new orchestrator waits for workers that are still bound to
              # the old one. Do not let the autoscaler move it.
              cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
          spec:
            serviceAccountName: default
            dnsPolicy: ClusterFirstWithHostNet
            hostNetwork: true
            restartPolicy: Never
            # Room for the orchestrator's SIGTERM cleanup (sandbox fleet teardown
            # and reap, stopping workers, and deleting sibling JobSets) when the
            # API server is slow. A clean exit still ends the pod immediately.
            terminationGracePeriodSeconds: 300
            nodeSelector:
              cloud.google.com/gke-nodepool: pathways-head-jax
            tolerations:
            - key: "cloud.google.com/gke-nodepool"
              operator: "Exists"
              effect: "NoSchedule"
            containers:
            - name: main
              image: us-west1-docker.pkg.dev/aishuk-test/tpu-poc-repo/tunix-poc:mlperf-65d021b-deepswe-raiden-20261015035906
              imagePullPolicy: Always
              securityContext:
                privileged: true
              resources:
                requests:
                  cpu: "8"
                  memory: 48G
                  ephemeral-storage: 20Gi
              command:
                - bash
                - -c
                - |
                  # PID 1 wrapper: forwards SIGTERM to background child process so K8s
                  # termination grace period shuts down workload cleanly without SIGKILL.
                  # Polling sleep loop ensures bash wakes up promptly to run trap handler.

                  echo "Program Start: $(date)"
                  _sigterm() (kill -SIGTERM $! 2>/dev/null)
                  trap _sigterm SIGTERM

                  (
                    cp /patch/sandbox_utils.py /app/examples/deepswe/sandbox_utils.py && cp /patch/run_deepswe_dist.py /app/tunix/experimental/examples/deepswe_dist/run_deepswe_dist.py && cp /patch/tunix_exporter.py /app/tunix/experimental/examples/deepswe_dist/tunix_exporter.py && cp /patch/swe_agent.py /app/examples/deepswe/swe_agent.py && cp /patch/r2_toolcall.py /app/examples/deepswe/r2_toolcall.py || exit 75
                           ORCHESTRATOR_ID="rs4c-orch"       NAMESPACE="agents-system" NODE_SELECTOR_KEY="sandbox.gke.io/runtime" NODE_SELECTOR_VAL="gvisor" IMAGE_REWRITE_PREFIX="us-central1-docker.pkg.dev/aishuk-test/swe-mirror/namanjain12"  SANDBOX_IMAGE_PULL_POLICY="IfNotPresent"      JOB_PREFIX="rs4c"           SCAFFOLD="r2egym"                                   WANDB_PROJECT="trellis-deepswe"       WANDB_RUN_NAME=""       ROLLOUT_WORKERS="1"       EPISODE_TIMEOUT_SECS="5400"       WEIGHT_SYNC_DISABLE_TIMEOUTS="0"                                                 MALLOC_ARENA_MAX="4"       MALLOC_MMAP_THRESHOLD_="131072"       PYTHONUNBUFFERED=1       TUNIX_IS_INTERNAL_ENV=false       TUNIX_DEBUG_INFERENCE_LOGS="true"              HF_HUB_OFFLINE=0 TRANSFORMERS_OFFLINE=0 SANDBOX_RUNTIME_CLASS=gvisor TUNIX_EXPORTER_PORT=8849 TUNIX_RUN_NAME=rs4c TOOLCALL_MODE=qwen_json STRIP_THINK=0 TOOLCALL_TOOL_ROLE=1  SAVE_JAX_CACHE="true" WANDB_MODE=disabled python -m tunix.experimental.distributed.runtime.main         --discovery_id=rs4c-orch         --discovery_port=20590         --process_main=tunix.experimental.examples.deepswe_dist.run_deepswe_dist.main         --model_id=Qwen/Qwen3-4B         --tokenizer_path=Qwen/Qwen3-4B         --batch_size=128         --mini_batch_size=128         --num_generations=4                  --prefer_valid_rollouts         --rollout_replicas=1         --temperature=1.0         --top_p=1.0         --top_k=-1         --max_steps=8         --max_turns=20         --max_prompt_length=2048         --max_response_length=6144         --train_micro_batch_size=1         --beta=0.0         --epsilon=0.2                                                                                                   --dataset_name=R2E-Gym/R2E-Gym-Subset         --dataset_split=train         --dataset_cache_dir=artifacts/qwen3_dist_deepswe/dataset_cache         --seed=42         --env_backend=kubernetes         --scaffold=r2egym         --step_timeout_secs=1800         --reward_timeout_secs=1800                                                      --flush_every_n_steps=1         --wandb_project="trellis-deepswe"         --wandb_run_name=""         --weight_sync_mode=raiden                  --stop_workers_on_exit         --max_warmpool_replicas=4         --sandbox_wait_initial         --no-prepull_sandbox_images                           --prewarm_max_workers=32         --max_concurrency=384         --rollout_fault_tolerance                                             --no-recover_unknown_transfer_state         --max_staleness=1                  --trajectory_group_order=arrival         --use_rollout_logps         --exact_token_continuity         --no-async_weight_sync         --no-pipeline_train_microbatches         --in_flight_weight_updates         --no-rollout_priority_scheduling                  --dataset_path=/tmp/tunix-data/r2e-cal         --shuffle         --use_agent_sandbox         --image_rewrite_prefix=us-central1-docker.pkg.dev/aishuk-test/swe-mirror/namanjain12                           --trainer_fsdp=1                                    --eval_every_n_steps=1000000         --learning_rate=1e-6         --b1=0.9         --b2=0.999         --weight_decay=0.01         --max_grad_norm=1.0         --train_mesh_tp=8         --train_mesh_context=1         --train_mesh_expert=1         --rollout_mesh_tp=4         --rollout_mesh_expert=1         --rollout_engine=inprocess_vllm         --tpu_topology=tpuv6e:2x2+tpuv6e:2x2         --target_accuracy=0.69                                         
                  ) & PID=$!

                  while kill -0 $PID 2>/dev/null; do
                    sleep 5
                  done
                  wait $PID
                  EXIT_CODE=$?

                  echo "Tearing down sibling JobSets for gang 'rs4c' in namespace 'default'..."
                  kubectl delete jobsets.jobset.x-k8s.io -n "default" -l "scheduling.x-k8s.io/gang-id=rs4c" --field-selector="metadata.name!=rs4c-orch" --ignore-not-found=true --wait=false || echo "WARNING: sibling JobSet teardown failed (exit $?)"

                  echo "Program End: $(date)"
                  echo "EXIT_CODE=$EXIT_CODE"
                  exit $EXIT_CODE
              env:
              # Injects the JobSet Name
              - name: JOBSET_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-name']
              # Injects the Replicated Job Name
              - name: REPLICATED_JOB_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/replicatedjob-name']
              # Injects the Job Index (which replica group)
              - name: JOB_INDEX
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/job-index']
              # Injects the local Pod Index (if you have multiple completions per job)
              - name: POD_INDEX
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['batch.kubernetes.io/job-completion-index']
              ports:
              - containerPort: 20590
                name: grpc # Naming it 'grpc' tells GKE to optimize for HTTP/2
              volumeMounts:
              - name: patch
                mountPath: /patch
              - name: tmp
                mountPath: /tmp
            volumes:
            - name: patch
              configMap:
                name: tunix-deepswe-patch-ctl
            - name: tmp
              hostPath:
                path: /tmp
                type: DirectoryOrCreate
