apiVersion: batch/v1
kind: Job
metadata:
  name: tr-gold-grader
  namespace: default
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 5400
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: tr-gold-grader}
    spec:
      serviceAccountName: default
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-nodepool: pathways-head-jax
      tolerations:
      - key: cloud.google.com/gke-nodepool
        operator: Exists
        effect: NoSchedule
      containers:
      - name: main
        image: us-west1-docker.pkg.dev/aishuk-test/tpu-poc-repo/tunix-poc:mlperf-65d021b-deepswe-raiden-20261015035906
        imagePullPolicy: IfNotPresent
        resources:
          requests: {cpu: "4", memory: 16G}
        command: ["bash", "-c"]
        args:
          - |
            set -e
            cp /patch/sandbox_utils.py /app/examples/deepswe/sandbox_utils.py
            cp /patch/openhands_utils.py /app/examples/deepswe/openhands_utils.py
            cp /patch/swe_agent.py /app/examples/deepswe/swe_agent.py
            cd /app && exec python -u /grader/gold_grader.py
        env:
        - {name: ORCHESTRATOR_ID, value: tr-grader-orch}
        - {name: NAMESPACE, value: agents-system}
        - {name: SANDBOX_NAMESPACE, value: agents-system}
        - {name: NODE_SELECTOR_KEY, value: cloud.google.com/gke-nodepool}
        - {name: NODE_SELECTOR_VAL, value: swe-gvisor-pool-eu}
        - {name: IMAGE_REWRITE_PREFIX, value: us-central1-docker.pkg.dev/aishuk-test/swe-mirror/namanjain12}
        - {name: SANDBOX_IMAGE_PULL_POLICY, value: IfNotPresent}
        - {name: SANDBOX_RUNTIME_CLASS, value: gvisor}
        - {name: SCAFFOLD, value: r2egym}
        - {name: ROW_IDX, value: "0,1,2,3"}
        - {name: WITH_CONTROL, value: "1"}
        - {name: HF_HUB_OFFLINE, value: "0"}
        - {name: TRANSFORMERS_OFFLINE, value: "0"}
        - {name: PYTHONUNBUFFERED, value: "1"}
        - {name: TUNIX_IS_INTERNAL_ENV, value: "false"}
        volumeMounts:
        - {name: patch, mountPath: /patch}
        - {name: grader, mountPath: /grader}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: patch
        configMap: {name: tunix-reward-patch}
      - name: grader
        configMap: {name: tr-gold-grader}
      - name: tmp
        hostPath: {path: /tmp, type: DirectoryOrCreate}
