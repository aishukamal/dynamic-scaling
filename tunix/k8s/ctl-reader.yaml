apiVersion: v1
kind: Pod
metadata: {name: rc-ctl-reader, namespace: default, labels: {app: rc-tools}}
spec:
  restartPolicy: Never
  nodeSelector: {cloud.google.com/gke-nodepool: pathways-head-jax}
  tolerations: [{key: cloud.google.com/gke-nodepool, operator: Exists, effect: NoSchedule}]
  containers:
  - name: main
    image: busybox:1.36
    command: ["sh", "-c", "ls -la /host-ctl/ && wc -l /host-ctl/*.jsonl && sleep 3600"]
    volumeMounts: [{name: ctl, mountPath: /host-ctl}]
  volumes: [{name: ctl, hostPath: {path: /tmp/tunix-controller}}]
