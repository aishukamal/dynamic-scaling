# ServiceAccount + Role for the Tunix pool controller: JobSets (create/delete the per-worker rollout JobSets) and
# read-only pods/services in namespace default. Nothing cluster-wide.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tunix-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tunix-controller
  namespace: default
rules:
- apiGroups: ["jobset.x-k8s.io"]
  resources: ["jobsets"]
  verbs: ["get", "list", "watch", "create", "delete", "patch"]
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tunix-controller
  namespace: default
subjects:
- kind: ServiceAccount
  name: tunix-controller
  namespace: default
roleRef:
  kind: Role
  name: tunix-controller
  apiGroup: rbac.authorization.k8s.io
